steps:
  # Step 1: Check out the repository code
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      submodules: 'recursive'

  # Step 2: Set up JDK 17 for building the Android app
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  # Step 3: Set up Gradle with caching
  - name: Set up Gradle
    uses: gradle/gradle-build-action@v3

  # Step 4: Grant execute permission to the gradlew script
  - name: Grant execute permission to gradlew
    working-directory: ./KernelSU-Next/manager
    run: chmod +x ./gradlew

  # Step 5: Build the debug APK
  - name: Build with Gradle
    working-directory: ./KernelSU-Next/manager
    run: ./gradlew assembleDebug

  # Step 6: Upload the final APK as a downloadable artifact
  - name: Upload APK as Artifact
    uses: actions/upload-artifact@v4
    with:
      name: manager-apk
      path: KernelSU-Next/manager/build/outputs/apk/debug/app-debug.apk
